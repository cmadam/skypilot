# SkyPilot task: SFT training — tests driver topology + PATH injection
# Verifies driver-injected vars, then runs training via direct accelerate
# (FSDP config not compatible with single-GPU, so we skip it)
#
# Usage:
#   sky exec sft-test examples/lsf-sft-test-10k-script.yaml

resources:
  cloud: lsf
  accelerators: H100:1
  image_id: docker://us.icr.io/cil15-shared-registry/open-instruct-tuning:0.1.0-conda

run: |
  set -e
  echo "=== SFT Test on $(hostname) ==="
  echo "GPU check:"
  nvidia-smi --query-gpu=name,memory.total --format=csv,noheader

  # ─── Verify driver-injected topology vars ──────────────────────────────
  echo ""
  echo "=== Driver-injected environment ==="
  echo "  NUM_GPUS_PER_NODE=${NUM_GPUS_PER_NODE:-MISSING}"
  echo "  WORLD_SIZE=${WORLD_SIZE:-MISSING}"
  echo "  RANK=${RANK:-MISSING}"
  echo "  MASTER_ADDR=${MASTER_ADDR:-MISSING}"
  echo "  MASTER_PORT=${MASTER_PORT:-MISSING}"
  echo "  LSB_JOBID=${LSB_JOBID:-MISSING}"
  echo "  LSB_HOSTS=${LSB_HOSTS:-MISSING}"

  # Verify PATH includes miniconda
  echo "  PATH=$PATH"
  if ! command -v accelerate &>/dev/null; then
    echo "ERROR: accelerate not found in PATH"
    exit 1
  fi
  echo "  accelerate=$(which accelerate)"
  echo ""

  # ─── Training ──────────────────────────────────────────────────────────
  SUBSET_DIR="/proj/granite-build/g4os/datasets/tokenized/all_combined/tokenized/8192/data_filtered_10k"
  MODEL_PATH="/proj/granite-build/g4os/granite-4.0-350m-base/r251014a"
  CHAT_TEMPLATE_PATH="/proj/granite-build/g4os/chat_template.jinja"
  OUTPUT_DIR="/proj/granite-build/g4os/skypilot-test/sft/checkpoints"

  if [ ! -f "$SUBSET_DIR/state.json" ]; then
    echo "ERROR: 10k subset not found at $SUBSET_DIR"
    exit 1
  fi

  export PYTHONPATH="/stage"
  export OMP_NUM_THREADS=1
  export CUDA_DEVICE_ORDER="PCI_BUS_ID"

  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
  RUN_OUTPUT_DIR="$OUTPUT_DIR/v0-$(date +%Y%m%d)-${TIMESTAMP}"
  mkdir -p "$OUTPUT_DIR"

  echo "=== Starting SFT training ==="
  echo "  Model:   $MODEL_PATH"
  echo "  Dataset: $SUBSET_DIR"
  echo "  Output:  $RUN_OUTPUT_DIR"
  echo ""

  cd /stage
  accelerate launch \
    --mixed_precision bf16 \
    --num_machines 1 \
    --num_processes 1 \
    --machine_rank 0 \
    --main_process_ip localhost \
    --main_process_port ${MASTER_PORT:-29500} \
    open_instruct/finetune.py \
    --model_name_or_path "$MODEL_PATH" \
    --per_device_train_batch_size 4 \
    --gradient_accumulation_steps 2 \
    --learning_rate 1e-5 \
    --lr_scheduler_type linear \
    --warmup_ratio 0.03 \
    --weight_decay 0.0 \
    --num_train_epochs 1 \
    --output_dir "$RUN_OUTPUT_DIR" \
    --logging_steps 1 \
    --reduce_loss sum \
    --tokenized_data "$SUBSET_DIR" \
    --keep_last_n_checkpoints 5 \
    --checkpointing_steps epoch \
    --exp_name "skypilot-sft-test-10k_${TIMESTAMP}" \
    --seed 123 \
    --clip_grad_norm 1.0 \
    --max_seq_len 32768 \
    --hf_dir "${RUN_OUTPUT_DIR}-hf" \
    --use_flash_attn \
    --gradient_checkpointing \
    --use_fast \
    --padfree \
    --no_push_to_hub \
    --no_try_launch_beaker_eval_jobs \
    --chat_template "$CHAT_TEMPLATE_PATH"
